<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivo Inteligente IoT - Conexão Agrinho</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
    <div class="logo-area">
        <span class="iot-icon">🌱</span>
        <h1>BioTech IoT</h1>
    </div>

    <p class="subtitle">
        Monitoramento de Estufas Automatizadas • Projeto Agrinho
    </p>

    <button id="theme-toggle" class="btn-toggle">
        <span id="theme-icon">🌙</span>
        Modo Escuro
    </button>
</header>

<main class="dashboard-container">

    <section class="setup-section">
        <h2>Identificação do Produtor</h2>

        <form id="form-user">
            <div class="input-group">
                <label for="username">Nome do Operador:</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Ex: Maria Silva"
                >
            </div>

            <button type="button" id="btn-salvar" class="btn-main">
                Conectar ao Sistema
            </button>
        </form>

        <div id="welcome-msg" class="welcome-box hide"></div>
    </section>

    <section class="metrics-grid">

        <div class="card">
            <h3>Temperatura Interna</h3>
            <div class="value-display">
                <span id="temp-num">24.2</span>°C
            </div>
        </div>

        <div class="card">
            <h3>Umidade do Solo</h3>
            <div class="value-display">
                <span id="umid-num">62</span>%
            </div>
        </div>

    </section>

    <section class="control-panel">

        <h2>Status de Atuação em Tempo Real</h2>

        <div id="status-badge" class="badge badge-normal">
            Monitorando Estabilidade
        </div>

        <br><br>

        <button id="btn-simular" class="btn-secondary">
            Simular Nova Leitura dos Sensores
        </button>

    </section>

</main>

<script src="main.js"></script>

</body>
</html>
